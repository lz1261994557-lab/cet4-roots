xpected consequence.", "cn": "每个决定都可能产生意想不到的后果。"}, {"day": 9, "root": "sequ / secu", "rm": "跟随", "word": "subsequent", "parts": "sub + sequ + ent", "meaning": "随后的；后来的", "pos": "a", "sentence": "Subsequent studies produced similar results.", "cn": "后续研究得出了相似的结果。"}, {"day": 9, "root": "sens / sent", "rm": "感觉", "word": "sense", "parts": "sens + e", "meaning": "感觉；意识；意义", "pos": "n", "sentence": "A good sense of direction is useful when traveling.", "cn": "旅行时良好的方向感很有用。"}, {"day": 9, "root": "sens / sent", "rm": "感觉", "word": "sensitive", "parts": "sens + itive", "meaning": "敏感的；灵敏的", "pos": "a", "sentence": "Some people are sensitive to changes in temperature.", "cn": "有些人对温度变化很敏感。"}, {"day": 9, "root": "sens / sent", "rm": "感觉", "word": "sensible", "parts": "sens + ible", "meaning": "明智的；合理的", "pos": "a", "sentence": "It is sensible to prepare before an important exam.", "cn": "在重要考试前做好准备是明智的。"}, {"day": 10, "root": "cred", "rm": "相信", "word": "credit", "parts": "cred + it", "meaning": "信用；学分；赞扬", "pos": "n", "sentence": "The course is worth three academic credits.", "cn": "这门课程值三个学分。"}, {"day": 10, "root": "cred", "rm": "相信", "word": "credible", "parts": "cred + ible", "meaning": "可信的", "pos": "a", "sentence": "We need credible evidence before making a decision.", "cn": "做决定前我们需要可信的证据。"}, {"day": 10, "root": "cred", "rm": "相信", "word": "incredible", "parts": "in + cred + ible", "meaning": "难以置信的；极好的", "pos": "a", "sentence": "The view from the mountain was incredible.", "cn": "从山上看到的景色令人难以置信。"}, {"day": 10, "root": "gen", "rm": "产生、出生", "word": "generate", "parts": "gen + erate", "meaning": "产生；生成", "pos": "v", "sentence": "Solar panels can generate clean electricity.", "cn": "太阳能板可以产生清洁电力。"}, {"day": 10, "root": "gen", "rm": "产生、出生", "word": "generation", "parts": "gen + eration", "meaning": "一代；产生", "pos": "n", "sentence": "The younger generation uses technology in new ways.", "cn": "年轻一代以新的方式使用技术。"}, {"day": 10, "root": "gen", "rm": "产生、出生", "word": "genetic", "parts": "gen + etic", "meaning": "遗传的；基因的", "pos": "a", "sentence": "Some diseases are linked to genetic factors.", "cn": "一些疾病与遗传因素有关。"}, {"day": 10, "root": "fin", "rm": "结束、界限", "word": "final", "parts": "fin + al", "meaning": "最终的；期末的", "pos": "a", "sentence": "The final decision will be announced tomorrow.", "cn": "最终决定将于明天公布。"}, {"day": 10, "root": "fin", "rm": "结束、界限", "word": "define", "parts": "de + fin + e", "meaning": "定义；界定", "pos": "v", "sentence": "The report should clearly define the main problem.", "cn": "报告应该清楚界定主要问题。"}, {"day": 10, "root": "fin", "rm": "结束、界限", "word": "definite", "parts": "de + fin + ite", "meaning": "明确的；确定的", "pos": "a", "sentence": "We need a definite answer before Friday.", "cn": "我们需要在周五之前得到明确答复。"}];
let day=Number(localStorage.getItem('cet4DayV3')||3),q=[],cur=null,mode='',wrongStep=0;
let choiceDone=JSON.parse(localStorage.getItem('choiceDoneV3')||'{}');
let spellDone=JSON.parse(localStorage.getItem('spellDoneV3')||'{}');
let wrong=JSON.parse(localStorage.getItem('wrongV3')||'{}');
let wrongCount=JSON.parse(localStorage.getItem('wrongCountV3')||'{}');
let completedDays=JSON.parse(localStorage.getItem('completedDaysV3')||'[]');
let studyDates=JSON.parse(localStorage.getItem('studyDatesV3')||'[]');
const out=document.getElementById('out');

function todayStr(){const d=new Date();const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`}
function markStudy(){const t=todayStr();if(!studyDates.includes(t))studyDates.push(t)}
function countChoice(d=day){return (choiceDone['c'+d]||[]).length}
function countSpell(d=day){return (spellDone['s'+d]||[]).length}
function updateCompletedDays(){const total=words().length; if(countChoice(day)>=total && countSpell(day)>=total){ if(!completedDays.includes(day)) completedDays.push(day); completedDays.sort((a,b)=>a-b);} }
function streakCount(){ if(!studyDates.length) return 0; const set=new Set(studyDates); let n=0; let cur=new Date(); while(true){const y=cur.getFullYear();const m=String(cur.getMonth()+1).padStart(2,'0');const da=String(cur.getDate()).padStart(2,'0'); const s=`${y}-${m}-${da}`; if(set.has(s)){n++; cur.setDate(cur.getDate()-1);} else break;} return n;}
function renderStatus(){const total=words().length; const c=countChoice(day), s=countSpell(day), done=completedDays.includes(day); document.getElementById('statusCard').innerHTML=`<b>学习状态</b><div style="margin-top:10px"><div>第 ${day} 天完成度：<b>${c+s}</b> / <b>${total*2}</b>（选择 ${c}/${total}，拼写 ${s}/${total}）</div><div style="margin-top:6px">连续学习天数：<b>${streakCount()}</b> 天</div><div style="margin-top:6px">已完成计划天数：<b>${completedDays.length}</b> / 10 ${done?' · ✅ 当天已完成':''}</div></div>`}
function save(){updateCompletedDays();localStorage.setItem('cet4DayV3',day);localStorage.setItem('choiceDoneV3',JSON.stringify(choiceDone));localStorage.setItem('spellDoneV3',JSON.stringify(spellDone));localStorage.setItem('wrongV3',JSON.stringify(wrong));localStorage.setItem('wrongCountV3',JSON.stringify(wrongCount));localStorage.setItem('completedDaysV3',JSON.stringify(completedDays));localStorage.setItem('studyDatesV3',JSON.stringify(studyDates));renderStatus()}
function K(s){return s+day} function words(){return W.filter(x=>x.day===day)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}}
function blank(x){return x.sentence.replace(new RegExp('\\b'+x.word+'\\b','i'),'_____')}

function renderDays(){let e=document.getElementById('days');e.innerHTML='';for(let d=1;d<=10;d++){let b=document.createElement('button');b.textContent='第 '+d+' 天';b.className='daybtn '+(d===day?'active':'soft');b.onclick=()=>{day=d;markStudy();save();renderDays();learn()};e.appendChild(b)}}

function learn(){markStudy();save();
 let g={};words().forEach(x=>(g[x.root]??=[]).push(x));
 out.innerHTML=`<div class="card"><b>第 ${day} 天</b><p class="small">每个例句正常出现 3 次：学习 → 选择 → 拼写；只有错词才额外强化。</p></div>`+
 Object.entries(g).map(([r,a])=>`<div class="card"><div class="root">${r} = ${a[0].rm}</div>${a.map(x=>`<div class="word"><div class="en">${x.word} <button onclick='speak(${JSON.stringify(x.word)})'>🔊</button></div><b>记忆拆解：</b>${x.parts}<br><b>中文：</b>${x.meaning}<div class="ex"><i>${x.sentence}</i> <button onclick='speak(${JSON.stringify(x.sentence)})'>🔊</button><br>${x.cn}</div></div>`).join('')}</div>`).join('');
}

function start(m){markStudy();save();
 mode=m;wrongStep=0;let a=words();
 if(m==='choice'){let d=choiceDone[K('c')]||[];q=shuffle(a.filter(x=>!d.includes(x.word)))}
 else if(m==='spell'){let d=spellDone[K('s')]||[];q=shuffle(a.filter(x=>!d.includes(x.word)))}
 else{let bad=wrong[K('w')]||[],counts=wrongCount[K('wc')]||{};q=[];a.filter(x=>bad.includes(x.word)).forEach(x=>{for(let i=(counts[x.word]||0);i<3;i++)q.push(x)});q=shuffle(q)}
 next();
}
function next(){
 if(!q.length){out.innerHTML=`<div class="card"><h2>本轮完成 ✓</h2><p>${mode==='choice'?'今天 9 个词的选择训练全部轮完。':mode==='spell'?'今天 9 个词的拼写训练全部轮完。':'今天的错词额外强化完成。'}</p></div>`;return}
 cur=q.shift(); if(mode==='spell')spellQ(); else if(mode==='wrong'){wrongStep++;wrongStep%2===0?spellQ():choiceQ()} else choiceQ();
}
function samePos(x){let p=words().filter(y=>y.word!==x.word&&y.pos===x.pos);if(p.length<3)p=W.filter(y=>y.word!==x.word&&y.pos===x.pos);return p}
function choiceQ(){
 let opts=shuffle([cur,...shuffle(samePos(cur)).slice(0,3)]);
 out.innerHTML=`<div class="card"><div class="muted">选择训练 · 第 ${day} 天 · 剩余 ${q.length+1}</div><p class="small">选择题不显示中文句意。</p><h2>${blank(cur)}</h2>${opts.map(x=>`<button class="opt" data-w="${x.word}" onclick="choose(this,'${x.word}')">${x.word}</button>`).join('')}<div id="fb"></div></div>`;
}
function choose(btn,a){
 document.querySelectorAll('.opt').forEach(b=>b.disabled=true);let ok=a===cur.word;
 if(mode==='choice'){let k=K('c');choiceDone[k]=choiceDone[k]||[];if(!choiceDone[k].includes(cur.word))choiceDone[k].push(cur.word)}
 if(!ok){let k=K('w');wrong[k]=wrong[k]||[];if(!wrong[k].includes(cur.word))wrong[k].push(cur.word)}
 if(mode==='wrong'){let k=K('wc');wrongCount[k]=wrongCount[k]||{};wrongCount[k][cur.word]=(wrongCount[k][cur.word]||0)+1}
 btn.classList.add(ok?'ok':'bad');
 let opts=[...document.querySelectorAll('.opt')].map(b=>W.find(x=>x.word===b.dataset.w));
 document.getElementById('fb').innerHTML=`<div class="info">${ok?'✅ 正确':`❌ 你选了 <b>${a}</b>`}<p><b>正确答案：</b>${cur.word} = ${cur.meaning}<br><b>拆解：</b>${cur.parts}</p><b>本题所有选项：</b>${opts.map(x=>`<div>${x.word} = ${x.meaning}${x.word===a&&!ok?' ← 你选的':''}${x.word===cur.word?' ✓':''}</div>`).join('')}<div class="ex">${cur.sentence}<br>${cur.cn}</div></div><button class="dark" onclick="next()">下一题</button>`;save();
}
function spellQ(){
 out.innerHTML=`<div class="card"><div class="muted">拼写训练 · 第 ${day} 天 · 剩余 ${q.length+1}</div><p class="small">这里统一拼写目标词本身，不考变形。</p><button onclick='speak(${JSON.stringify(cur.word)})'>🔊 听发音</button><h2>${blank(cur)}</h2><p><b>中文句意：</b>${cur.cn}</p><p><b>词根提示：</b>${cur.root} = ${cur.rm}</p><input id="inp" autocomplete="off" autocapitalize="none" placeholder="输入目标单词"><button class="dark" onclick="checkSpell()">提交</button><div id="fb"></div></div>`;
}
function checkSpell(){
 let v=document.getElementById('inp').value.trim().toLowerCase(),ok=v===cur.word.toLowerCase();
 if(mode==='spell'){let k=K('s');spellDone[k]=spellDone[k]||[];if(!spellDone[k].includes(cur.word))spellDone[k].push(cur.word)}
 if(!ok){let k=K('w');wrong[k]=wrong[k]||[];if(!wrong[k].includes(cur.word))wrong[k].push(cur.word)}
 if(mode==='wrong'){let k=K('wc');wrongCount[k]=wrongCount[k]||{};wrongCount[k][cur.word]=(wrongCount[k][cur.word]||0)+1}
 document.getElementById('inp').disabled=true;
 document.getElementById('fb').innerHTML=`<div class="info">${ok?'✅ 拼写正确':`❌ 你写的是：<b>${v||'（空）'}</b>`}<p><b>正确拼写：</b>${cur.word} = ${cur.meaning}</p><p><b>拆解：</b>${cur.parts}</p><div class="ex">${cur.sentence}<br>${cur.cn}</div>${!ok?'<p>📝 这次拼写错误已加入错词强化。</p>':''}</div><button class="dark" onclick="next()">下一题</button>`;save();
}
function resetDay(){choiceDone[K('c')]=[];spellDone[K('s')]=[];wrongCount[K('wc')]={};completedDays=completedDays.filter(x=>x!==day);markStudy();save();out.innerHTML=`<div class="card"><h2>第 ${day} 天已重置</h2><p>错词记录保留，选择与拼写可以重新练。</p></div>`}
function overview(){markStudy();save();let h='<div class="card"><h2>30 个核心词根总览</h2></div>';for(let d=1;d<=10;d++){let rs=[...new Map(W.filter(x=>x.day===d).map(x=>[x.root,x])).values()];h+=`<div class="card"><b>第 ${d} 天</b>${completedDays.includes(d)?' <span class="badge">已完成</span>':''}${rs.map(r=>`<div style="margin-top:8px"><b>${r.root}</b> = ${r.rm}</div>`).join('')}</div>`}out.innerHTML=h}
renderDays();renderStatus();learn();
</script></main></body></html>
